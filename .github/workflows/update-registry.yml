name: Update Participants Registry

on:
  push:
    branches:
      - main
    paths:
      - 'participants/**'

jobs:
  update-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate registry.json
        run: |
          python3 -c "
          import os, json
          folders = sorted([
            d for d in os.listdir('participants')
            if d.startswith('participant-') and os.path.isdir(os.path.join('participants', d))
          ])
          with open('participants/registry.json', 'w') as f:
            json.dump(folders, f, indent=2)
            f.write('\n')
          print('Registry updated:', folders)
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add participants/registry.json
          git diff --staged --quiet || git commit -m "chore: auto-update participants registry"
          git push
