name: Update Participants Page

on:
  push:
    branches:
      - main
    paths:
      - 'participants/**/info.json'

jobs:
  update-page:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run update.py
        run: python3 update.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: auto-update participants page"
          git push
