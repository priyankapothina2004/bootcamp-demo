<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git & GitHub Bootcamp — KIET</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1f2e 0%, #16213e 50%, #0f3460 100%);
      border-bottom: 1px solid #2d3748;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 60% 0%, rgba(99,179,237,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .college-badge {
      display: inline-block;
      background: rgba(99,179,237,0.15);
      border: 1px solid rgba(99,179,237,0.35);
      color: #90cdf4;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 700;
      background: linear-gradient(90deg, #90cdf4, #667eea, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    header p {
      margin-top: 0.6rem;
      color: #718096;
      font-size: 0.95rem;
    }

    /* ── Main ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #4a5568;
      margin-bottom: 1.2rem;
    }

    /* ── Grid ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }

    /* ── Card ── */
    .card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 1.5rem 1.25rem 1.25rem;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #a78bfa);
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #4a5568;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }

    .card:hover::before { opacity: 1; }

    .card-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .card-name {
      font-size: 1rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .card-folder {
      font-size: 0.75rem;
      color: #4a5568;
      font-family: 'Courier New', monospace;
      word-break: break-all;
    }

    .card-arrow {
      margin-top: auto;
      font-size: 0.78rem;
      color: #667eea;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* ── Empty / Loading states ── */
    #status {
      grid-column: 1 / -1;
      text-align: center;
      color: #4a5568;
      font-size: 0.95rem;
      padding: 3rem 0;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem;
      color: #2d3748;
      font-size: 0.78rem;
      border-top: 1px solid #1a1f2e;
    }
  </style>
</head>
<body>

<header>
  <div class="college-badge">KIET Group of Institutions</div>
  <h1>Git &amp; GitHub Bootcamp</h1>
  <p>Participant project showcase</p>
</header>

<main>
  <p class="section-label">Participants</p>
  <div id="grid">
    <div id="status">Loading participants…</div>
  </div>
</main>

<footer>KIET Git &amp; GitHub Bootcamp &mdash; hosted on GitHub Pages</footer>

<script>
  function formatName(folder) {
    // "participant-ravi" → "Ravi"
    return folder
      .replace(/^participant-/i, '')
      .replace(/-/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  function initials(name) {
    return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  }

  async function load() {
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');

    try {
      const res = await fetch('participants/registry.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const folders = await res.json();

      if (!Array.isArray(folders) || folders.length === 0) {
        status.textContent = 'No participants found yet.';
        return;
      }

      grid.innerHTML = '';

      folders.forEach(folder => {
        const name = formatName(folder);
        const href = `participants/${folder}/index.html`;

        const card = document.createElement('a');
        card.className = 'card';
        card.href = href;
        card.innerHTML = `
          <div class="card-avatar">${initials(name)}</div>
          <div class="card-name">${name}</div>
          <div class="card-folder">${folder}/</div>
          <div class="card-arrow">View ${name}'s Details &rarr;</div>
        `;
        grid.appendChild(card);
      });

    } catch (err) {
      status.textContent = `Could not load registry: ${err.message}`;
      console.error(err);
    }
  }

  load();
</script>

</body>
</html>
