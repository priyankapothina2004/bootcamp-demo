<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git & GitHub Bootcamp — KIET</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1f2e 0%, #16213e 50%, #0f3460 100%);
      border-bottom: 1px solid #2d3748;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 60% 0%, rgba(99,179,237,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .college-badge {
      display: inline-block;
      background: rgba(99,179,237,0.15);
      border: 1px solid rgba(99,179,237,0.35);
      color: #90cdf4;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 700;
      background: linear-gradient(90deg, #90cdf4, #667eea, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    header p {
      margin-top: 0.6rem;
      color: #718096;
      font-size: 0.95rem;
    }

    /* ── Main ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #4a5568;
      margin-bottom: 1.2rem;
    }

    /* ── Grid ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }

    /* ── Card ── */
    .card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 1.5rem 1.25rem 1.25rem;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #a78bfa);
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #4a5568;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }

    .card:hover::before { opacity: 1; }

    .card-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #2d3748;
      background: linear-gradient(135deg, #667eea, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }

    .card-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .card-name {
      font-size: 1rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .card-roll {
      font-size: 0.75rem;
      color: #4a5568;
      font-family: 'Courier New', monospace;
    }

    .card-arrow {
      margin-top: auto;
      font-size: 0.78rem;
      color: #667eea;
      font-weight: 500;
    }

    /* ── Empty state ── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #4a5568;
      font-size: 0.95rem;
      padding: 3rem 0;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem;
      color: #2d3748;
      font-size: 0.78rem;
      border-top: 1px solid #1a1f2e;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 16px;
      width: 100%;
      max-width: 820px;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      animation: modalIn 0.22s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    .modal-close {
      position: sticky;
      top: 1rem;
      float: right;
      margin: 1rem 1rem 0 0;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      color: #a0aec0;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      z-index: 10;
    }

    .modal-close:hover {
      background: #2d3748;
      color: #e2e8f0;
    }

    #modal-content {
      padding: 0 0 1.5rem;
      clear: both;
    }

    /* Hide back-link inside modal */
    #modal-content .back-link { display: none; }
  </style>
</head>
<body>

<header>
  <div class="college-badge">KIET Group of Institutions</div>
  <h1>Git &amp; GitHub Bootcamp</h1>
  <p>Participant project showcase</p>
</header>

<main>
  <p class="section-label">Participants</p>
  <div id="grid">
<!-- PARTICIPANTS_START -->
<a class="card" href="participants/001-ravi/index.html" onclick="openModal(event,'participants/001-ravi/index.html')">
  <div class="card-avatar"><img src="https://github.com/ravi.png" alt="Ravi" onerror="this.parentElement.textContent='R'"></div>
  <div class="card-name">Ravi</div>
  <div class="card-roll">001</div>
  <div class="card-arrow">View Profile &rarr;</div>
</a>
<a class="card" href="participants/002-sneha/index.html" onclick="openModal(event,'participants/002-sneha/index.html')">
  <div class="card-avatar"><img src="https://github.com/sneha.png" alt="Sneha" onerror="this.parentElement.textContent='S'"></div>
  <div class="card-name">Sneha</div>
  <div class="card-roll">002</div>
  <div class="card-arrow">View Profile &rarr;</div>
</a>
<!-- PARTICIPANTS_END -->
  </div>
</main>

<footer>KIET Git &amp; GitHub Bootcamp &mdash; hosted on GitHub Pages</footer>

<!-- ── Modal ── -->
<div id="modal-overlay" class="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal-box" id="modal-box">
    <button class="modal-close" onclick="closeModal()" title="Close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
  async function openModal(e, url) {
    e.preventDefault();

    const overlay = document.getElementById('modal-overlay');
    const contentEl = document.getElementById('modal-content');

    // Show overlay with loading state
    contentEl.innerHTML = '<p style="padding:3rem;text-align:center;color:#4a5568;">Loading…</p>';
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    try {
      const resp = await fetch(url);
      const html = await resp.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      // Collect styles from the participant page
      const styles = Array.from(doc.querySelectorAll('style'))
        .map(s => s.textContent)
        .join('\n');

      // Remove the back-link since we're inside a modal
      const backLink = doc.querySelector('.back-link');
      if (backLink) backLink.remove();

      // Extract main content area
      const wrap = doc.querySelector('.page-wrap') || doc.body;
      const bodyHTML = wrap.innerHTML;

      contentEl.innerHTML = `<style>${styles}</style><div class="page-wrap">${bodyHTML}</div>`;

      // Make any links inside open in a new tab
      contentEl.querySelectorAll('a[href]').forEach(a => {
        if (!a.getAttribute('href').startsWith('#')) {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener noreferrer');
        }
      });
    } catch (err) {
      contentEl.innerHTML = '<p style="padding:3rem;text-align:center;color:#fc8181;">Failed to load profile.</p>';
    }
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('active');
    document.body.style.overflow = '';
  }

  function handleOverlayClick(e) {
    // Close only when clicking the backdrop, not the modal box
    if (!document.getElementById('modal-box').contains(e.target)) {
      closeModal();
    }
  }

  // Close on Escape key
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
</script>

</body>
</html>
