<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ravi's Project</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      line-height: 1.6;
    }

    .page-wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #90cdf4;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      transition: color 0.15s;
    }
    .back-link:hover { color: #a78bfa; }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      background: linear-gradient(90deg, #90cdf4, #667eea, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.75rem;
    }

    p { color: #cbd5e0; }
  </style>
</head>
<body>
<div class="page-wrap">
  <a class="back-link" href="../../index.html">← Back to All Participants</a>
  <h1>Ravi</h1>
  <p>I built a weather dashboard that fetches live data from a public API and displays temperature, humidity, and forecasts for any city.</p>
</div>
</body>
</html>
